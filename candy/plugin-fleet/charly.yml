version: 2026.232.0520
plugin-fleet:
    candy:
        version: 2026.193.1200
        description: |-
            The `charly deploy …` deployment CLI, externalized into a COMPILED-IN
            command:deploy plugin (F8) mirroring candy/plugin-vm. `charly deploy add`
            / `del` / `show` / `export` / `import` / `reset` / `path` / `status` /
            `from-box` dispatch IN-PROC via Invoke(OpRun) (runDeployCommand →
            kong-parse the DeployCmd tree), so the handlers run in charly's OWN process
            and inherit charly's real stdio/TTY natively. Each leaf FORWARDS its parsed
            flags to the host over four generic host-build seams — HostBuild deploy-add /
            deploy-del / deploy-from-box (the deploy dispatch) and deploy-config (the
            show/export/import/reset/status config-management ops) — where the host runs
            the existing deploy orchestration VERBATIM: the config loader + deploy ledger,
            the InstallPlan compiler, and the deploy-dispatch kernel (ResolveTarget →
            the plugin-side deploy dispatcher over the executor reverse channel) all STAY
            core. `path`
            resolves plugin-side via kit.DefaultDeployConfigPath (no seam). command:deploy
            is COMPILED-IN; its grammar is prescanned into the CLI.
        plugin:
            providers:
                - command:deploy
            source: github.com/opencharly/plugin-fleet/candy/plugin-fleet
        plan:
            - # ADE check: a deterministic build-context check that does NOT depend on the
              # project context the `charly deploy` CLI needs. Mirrors plugin-vm /
              # plugin-example-command — a trivial build-context `plugin: command` (the
              # built-in command CHECK verb) running `true`. The full CLI end-to-end
              # (`charly deploy add`/`del` deploy dispatch) is exercised by the Go e2e +
              # the live R10 bed roster (deploy add is every bed's entry point).
              check: the command:deploy plugin ships a buildable Go module the host compiles into charly; the full `charly deploy add`/`del` deploy dispatch is exercised by the Go e2e + the live R10 roster
              id: deploy-module-present
              context:
                - build
              command: "true"
